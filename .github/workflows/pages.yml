name: Deploy Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-src: https://github.com/roothide/theos.git

      - name: Install ldid
        run: |
          curl -fL -o /usr/local/bin/ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x /usr/local/bin/ldid
          ldid -h 2>&1 | head -2

      - name: Build (rootless)
        run: make package FINALPACKAGE=1

      - name: Build (roothide)
        run: make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Install dpkg-dev (dpkg-scanpackages)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev

      - name: Assemble site + Sileo repo
        run: |
          mkdir -p _site/packages
          cp -r docs/. _site/
          cp packages/*.deb _site/packages/
          touch _site/.nojekyll
          cd _site
          dpkg-scanpackages --multiversion packages /dev/null > Packages
          gzip -9c Packages > Packages.gz
          UUID=$(cat /proc/sys/kernel/random/uuid)
          DATE=$(date -u +"%a, %d %b %Y %H:%M:%S %z")
          {
            echo "Origin: Little16"
            echo "Label: Little16"
            echo "Suite: stable"
            echo "Version: 1.0"
            echo "Codename: little16"
            echo "Date: $DATE"
            echo "Architectures: iphoneos-arm64 iphoneos-arm64e"
            echo "Description: Little16 - iPhone X gestures for iOS 16"
            echo "SHA256:"
            echo " $(sha256sum Packages  | cut -d' ' -f1) $(stat -c%s Packages)  Packages"
            echo " $(sha256sum Packages.gz | cut -d' ' -f1) $(stat -c%s Packages.gz) Packages.gz"
          } > Release
          ls -la

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4