name: Build DEB

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          # roothide/theos fork provides BOTH the 'rootless' and 'roothide' schemes.
          theos-src: https://github.com/roothide/theos.git

      - name: Install ldid (required, otherwise theos ships .unsigned binaries)
        run: sudo apt-get update && sudo apt-get install -y ldid

      - name: Build (rootless)
        run: make package FINALPACKAGE=1

      - name: List rootless packages
        run: ls -la packages/

      - name: Build (roothide)
        run: make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debs
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release (update on every push)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Little16 Custom v1.0.0
          body: |
            Little16 Custom - gestures + control center for iPhone 8 / home-button devices.

            - `*-arm64.deb`    = rootless (Dopamine / palera1n rootless)
            - `*-arm64e.deb`   = roothide (Dopamine2-roothide)
          files: packages/*.deb
          overwrite_files: true
          fail_on_unmatched_files: false